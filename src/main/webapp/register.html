<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户注册 - 用户管理系统</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">用户管理系统</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="login.html">登录</a>
            <a class="nav-link active" href="register.html">注册</a>
            <a class="nav-link" href="forgot.html">忘记密码</a>
            <a class="nav-link" href="logout">退出</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-1">用户注册</h4>
                    <p class="text-center text-muted small mb-4">带 <span class="text-danger">*</span> 的为必填项</p>

                    <!-- 服务端校验失败时显示红色提示条 -->
                    <div id="tip" class="d-none mb-3"></div>

                    <form id="registerForm" action="register" method="post" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="3~16 位字母、数字或下划线"
                                   pattern="[A-Za-z0-9_]{3,16}" required autofocus>
                            <div class="invalid-feedback">用户名只能是 3~16 位的字母、数字或下划线</div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="6~20 位" minlength="6" maxlength="20" required>
                                <div class="invalid-feedback">密码长度必须是 6~20 位</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="confirmPassword" class="form-label">确认密码 <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                       placeholder="再输入一次" required>
                                <div class="invalid-feedback">两次输入的密码不一致</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="realName" class="form-label">真实姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="realName" name="realName"
                                   placeholder="请输入真实姓名" required>
                            <div class="invalid-feedback">请输入真实姓名</div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">邮箱 <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="例如 student@example.com" required>
                            <div class="form-text">邮箱是找回密码时的身份凭证，注册后不能填错。</div>
                            <div class="invalid-feedback">邮箱格式不正确</div>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">手机号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   placeholder="11 位手机号" pattern="1[3-9]\d{9}" required>
                            <div class="invalid-feedback">手机号必须是 1 开头的 11 位数字</div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">注 册</button>
                    </form>

                    <hr class="my-4">
                    <div class="text-center small">
                        <a href="login.html">已有账号？去登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="static/js/bootstrap.bundle.min.js"></script>
<script>
    // 1. 显示 Servlet 跳回来的中文提示（textContent 防 XSS）
    (function showServerMessage() {
        const error = new URLSearchParams(location.search).get('error');
        if (!error) return;
        const box = document.getElementById('tip');
        box.textContent = '⚠️ ' + error;
        box.className = 'alert alert-danger py-2 mb-3';
    })();

    // 2. 「两次密码一致」这类跨字段规则 HTML 自带的 required/pattern 管不了，必须手写
    const pwd = document.getElementById('password');
    const confirmPwd = document.getElementById('confirmPassword');

    function checkPasswordMatch() {
        if (confirmPwd.value !== pwd.value) {
            confirmPwd.setCustomValidity('两次输入的密码不一致');
        } else {
            confirmPwd.setCustomValidity('');
        }
    }

    pwd.addEventListener('input', checkPasswordMatch);
    confirmPwd.addEventListener('input', checkPasswordMatch);

    // 3. 提交前先跑一遍前端校验
    document.getElementById('registerForm').addEventListener('submit', function (event) {
        checkPasswordMatch();
        const form = this;
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }
        form.classList.add('was-validated');
    });
</script>
</body>
</html>
