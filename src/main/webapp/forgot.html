<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>忘记密码 - 用户管理系统</title>
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">用户管理系统</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">首页</a>
            <a class="nav-link" href="login.html">登录</a>
            <a class="nav-link" href="register.html">注册</a>
            <a class="nav-link active" href="forgot.html">忘记密码</a>
            <a class="nav-link" href="logout">退出</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-1">找回密码</h4>
                    <p class="text-center text-muted small mb-4">
                        用「用户名 + 注册邮箱」验证身份，通过后系统会生成一个新的随机密码
                    </p>

                    <!-- 服务端校验失败时显示红色提示条 -->
                    <div id="tip" class="d-none mb-3"></div>

                    <form id="forgotForm" action="forgot" method="post" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="请输入注册时的用户名" required autofocus>
                            <div class="invalid-feedback">请输入用户名</div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">注册邮箱 <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="请输入注册时填写的邮箱" required>
                            <div class="invalid-feedback">请输入正确的邮箱地址</div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">重置密码</button>
                    </form>

                    <hr class="my-4">
                    <div class="alert alert-light border small text-muted mb-3">
                        <strong>说明：</strong>真实项目应通过「发送邮件重置链接」或「短信验证码」完成找回，
                        本作业没有邮件 / 短信服务器，所以校验通过后直接把新密码显示在结果页上。
                        另外用户数据存在内存中，重启 Tomcat 后密码会恢复为初始值。
                    </div>
                    <div class="text-center small">
                        <a href="login.html">想起密码了？去登录</a>
                    </div>
                </div>
            </div>
            <p class="text-center text-muted small mt-3 mb-0">
                演示账号：<code>admin</code> + <code>admin@example.com</code>
            </p>
        </div>
    </div>
</div>

<script src="static/js/bootstrap.bundle.min.js"></script>
<script>
    // 显示 Servlet 跳回来的中文提示（textContent 防 XSS）
    (function showServerMessage() {
        const error = new URLSearchParams(location.search).get('error');
        if (!error) return;
        const box = document.getElementById('tip');
        box.textContent = '⚠️ ' + error;
        box.className = 'alert alert-danger py-2 mb-3';
    })();

    // 提交前跑一遍前端校验（只为体验，安全边界在 Servlet 里）
    document.getElementById('forgotForm').addEventListener('submit', function (event) {
        const form = this;
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }
        form.classList.add('was-validated');
    });
</script>
</body>
</html>
